" data-maxw="284">Google · Microsoft 365 · CalDAV</text><path d="M1142,394 L1220,394 L1220,278 L1438,278" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#arr-slate)" marker-end="url(#arr-slate)"/><text x="1262" y="256" font-size="12" font-weight="400" fill="#475569" text-anchor="start" data-maxw="172">Synchro libre / occupé</text><text x="1262" y="270.4" font-size="12" font-weight="400" fill="#475569" text-anchor="start" data-maxw="172">(OAuth 2.0)</text><rect x="1440" y="348" width="320" height="84" rx="14" ry="14" fill="#FBFCFD" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1458" y="384" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start" data-maxw="284">Base de médicaments</text><text x="1458" y="406" font-size="13" font-weight="400" fill="#475569" text-anchor="start" data-maxw="284">Référentiel médicaments et interactions</text><path d="M1142,448 L1240,448 L1240,390 L1438,390" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#arr-slate)" marker-end="url(#arr-slate)"/><text x="1262" y="368" font-size="12" font-weight="400" fill="#475569" text-anchor="start" data-maxw="172">Contrôles interactions,</text><text x="1262" y="382.4" font-size="12" font-weight="400" fill="#475569" text-anchor="start" data-maxw="172">allergies, posologie</text><rect x="1440" y="460" width="320" height="84" rx="14" ry="14" fill="#FBFCFD" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1458" y="496" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start" data-maxw="284">Services nationaux de santé</text><text x="1458" y="518" font-size="13" font-weight="400" fill="#475569" text-anchor="start" data-maxw="284">e-prescription · INS · dossier partagé</text><path d="M1142,502 L1260,502 L1260,502 L1438,502" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#arr-slate)" marker-end="url(#arr-slate)"/><text x="1262" y="480" font-size="12" font-weight="400" fill="#475569" text-anchor="start" data-maxw="172">Échanges FHIR</text><text x="1262" y="494.4" font-size="12" font-weight="400" fill="#475569" text-anchor="start" data-maxw="172">(après la v1)</text><rect x="1440" y="572" width="320" height="84" rx="14" ry="14" fill="#FBFCFD" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1458" y="608" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start" data-maxw="284">Systèmes des pharmacies</text><text x="1458" y="630" font-size="13" font-weight="400" fill="#475569" text-anchor="start" data-maxw="284">Logiciels d'officine · stocks</text><path d="M1142,556 L1240,556 L1240,614 L1438,614" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#arr-slate)" marker-end="url(#arr-slate)"/><text x="1262" y="592" font-size="12" font-weight="400" fill="#475569" text-anchor="start" data-maxw="172">Ordonnances et stocks</text><text x="1262" y="606.4" font-size="12" font-weight="400" fill="#475569" text-anchor="start" data-maxw="172">(REST · webhooks)</text><rect x="1440" y="684" width="320" height="84" rx="14" ry="14" fill="#FBFCFD" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1458" y="720" font-size="17" font-weight="700" fill="#0F172A" text-anchor="start" data-maxw="284">Fournisseurs de messagerie</text><text x="1458" y="742" font-size="13" font-weight="400" fill="#475569" text-anchor="start" data-maxw="284">SMS · e-mail · push (APNs/FCM)</text><path d="M1142,610 L1220,610 L1220,726 L1438,726" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" marker-start="url(#arr-slate)" marker-end="url(#arr-slate)"/><text x="1262" y="704" font-size="12" font-weight="400" fill="#475569" text-anchor="start" data-maxw="172">Notifications sans</text><text x="1262" y="718.4" font-size="12" font-weight="400" fill="#475569" text-anchor="start" data-maxw="172">détail de santé</text><rect x="14