  </defs>
  <rect x="0" y="0" width="1920" height="900" fill="#FFFFFF"/>
  <text x="40" y="54" font-size="30" font-weight="800" fill="#0F172A" text-anchor="start">Accès d'urgence (bris de glace)</text><text x="40" y="84" font-size="16" font-weight="400" fill="#475569" text-anchor="start">Exigence de priorité haute H3 · accès immédiat aux données critiques pour les professionnels habilités, avec une traçabilité complète a posteriori</text><rect x="40" y="124" width="328" height="232" rx="16" ry="16" fill="#FFFFFF" stroke="#8CCFC7" stroke-width="1.6" filter="url(#shadow)"/><circle cx="74" cy="160" r="18" fill="#0E7C7B"/><text x="74" y="166.5" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="102" y="167" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" data-maxw="254">Identifier le patient</text><text x="62" y="208" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Recherche exacte uniquement :</text><text x="62" y="227.88" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">INS / identifiant MedX, ou</text><text x="62" y="247.76" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">nom + date de naissance + sexe</text><text x="62" y="267.64" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Identité minimale pour</text><text x="62" y="287.52" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">confirmer le patient</text><text x="62" y="307.4" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Ni navigation, ni jokers</text><path d="M374,240 L412,240" fill="none" stroke="#0E7C7B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-teal)"/><rect x="418" y="124" width="328" height="232" rx="16" ry="16" fill="#FFFFFF" stroke="#8CCFC7" stroke-width="1.6" filter="url(#shadow)"/><circle cx="452" cy="160" r="18" fill="#0E7C7B"/><text x="452" y="166.5" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="480" y="167" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" data-maxw="254">Déclarer l'urgence</text><text x="440" y="208" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Code motif (inconscient,</text><text x="440" y="227.88" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">pronostic vital engagé,</text><text x="440" y="247.76" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">consentement impossible…)</text><text x="440" y="267.64" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Justification en texte libre</text><text x="440" y="287.52" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Engagement de responsabilité</text><text x="440" y="307.4" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">« Je serai audité »</text><path d="M752,240 L790,240" fill="none" stroke="#0E7C7B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-teal)"/><rect x="796" y="124" width="328" height="232" rx="16" ry="16" fill="#FFFFFF" stroke="#8CCFC7" stroke-width="1.6" filter="url(#shadow)"/><circle cx="830" cy="160" r="18" fill="#0E7C7B"/><text x="830" y="166.5" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="858" y="167" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" data-maxw="254">MFA renforcée</text><text x="818" y="208" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Passkey ou carte (e-CPS)</text><text x="818" y="227.88" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">dans les 15 dernières minutes</text><text x="818" y="247.76" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Le moteur de politiques</text><text x="818" y="267.64" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">vérifie le droit</text><text x="818" y="287.52" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">acces_urgence et</text><text x="818" y="307.4" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">l'opposition du patient</text><path d="M1130,240 L1168,240" fill="none" stroke="#0E7C7B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-teal)"/><rect x="1174" y="124" width="328" height="232" rx="16" ry="16" fill="#FFFFFF" stroke="#8CCFC7" stroke-width="1.6" filter="url(#shadow)"/><circle cx="1208" cy="160" r="18" fill="#0E7C7B"/><text x="1208" y="166.5" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="1236" y="167" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" data-maxw="254">Autorisation limitée</text><text x="1196" y="208" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">4 heures · lecture seule</text><text x="1196" y="227.88" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Ce patient uniquement</text><text x="1196" y="247.76" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Autorisation + audit écrits</text><text x="1196" y="267.64" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">dans la même transaction</text><text x="1196" y="287.52" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Renouvelable avec un</text><text x="1196" y="307.4" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">nouveau motif</text><path d="M1508,240 L1546,240" fill="none" stroke="#0E7C7B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-teal)"/><rect x="1552" y="124" width="328" height="232" rx="16" ry="16" fill="#FDEDE8" stroke="#E4572E" stroke-width="2.2" filter="url(#shadow)"/><circle cx="1586" cy="160" r="18" fill="#E4572E"/><text x="1586" y="166.5" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="1614" y="167" font-size="18" font-weight="800" fill="#8C2A10" text-anchor="start" data-maxw="254">Synthèse en &lt; 1 s</text><text x="1574" y="208" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">Résumé patient (IPS) :</text><text x="1574" y="227.88" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">allergies, problèmes actifs,</text><text x="1574" y="247.76" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">traitements, groupe sanguin,</text><text x="1574" y="267.64" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">implants, directives</text><text x="1574" y="287.52" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">anticipées, contacts</text><text x="1574" y="307.4" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">Dossier complet : même accès</text><rect x="40" y="376" width="1840" height="44" rx="22" ry="22" fill="#0B3B4A" stroke="#0B3B4A" stroke-width="1"/><text x="960" y="404" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Soignant : ≈ 30 secondes de la recherche aux données (étapes humaines)   ·   Système : p95 &lt; 300 ms par appel d'API   ·   Disponibilité 99,99 %</text><text x="40" y="464" font-size="14" font-weight="800" fill="#E4572E" text-anchor="start">GARDE-FOUS — RESPONSABILITÉ A POSTERIORI (l'accès n'est jamais bloqué, il est toujours justifié)</text><rect x="40" y="482" width="328" height="128" rx="14" ry="14" fill="#FDEDE8" stroke="#F4B6A3" stroke-width="1.5"/><text x="60" y="514" font-size="16.5" font-weight="800" fill="#8C2A10" text-anchor="start" data-maxw="288">Audit immuable</text><text x="60" y="543" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">AuditEvent, finalité =</text><text x="60" y="562.6" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">traitement d'urgence, conservé</text><text x="60" y="582.2" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">dans la piste WORM</text><rect x="418" y="482" width="328" height="128" rx="14" ry="14" fill="#FDEDE8" stroke="#F4B6A3" stroke-width="1.5"/><text x="438" y="514" font-size="16.5" font-weight="800" fill="#8C2A10" text-anchor="start" data-maxw="288">Alerte en temps réel</text><text x="438" y="543" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">Le DPO est alerté via le</text><text x="438" y="562.6" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">SIEM dès le début</text><text x="438" y="582.2" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">de l'accès</text><rect x="796" y="482" width="328" height="128" rx="14" ry="14" fill="#FDEDE8" stroke="#F4B6A3" stroke-width="1.5"/><text x="816" y="514" font-size="16.5" font-weight="800" fill="#8C2A10" text-anchor="start" data-maxw="288">Patient informé</text><text x="816" y="543" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">Avis in-app + e-mail sous</text><text x="816" y="562.6" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">24 h : qui, quand,</text><text x="816" y="582.2" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">ce qui a été consulté</text><rect x="1174" y="482" width="328" height="128" rx="14" ry="14" fill="#FDEDE8" stroke="#F4B6A3" stroke-width="1.5"/><text x="1194" y="514" font-size="16.5" font-weight="800" fill="#8C2A10" text-anchor="start" data-maxw="288">Revue obligatoire</text><text x="1194" y="543" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">DPO + responsable médical</text><text x="1194" y="562.6" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">revoient chaque cas</text><text x="1194" y="582.2" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">sous 72 h</text><rect x="1552" y="482" width="328" height="128" rx="14" ry="14" fill="#FDEDE8" stroke="#F4B6A3" stroke-width="1.5"/><text x="1572" y="514" font-size="16.5" font-weight="800" fill="#8C2A10" text-anchor="start" data-maxw="288">Détection des abus</text><text x="1572" y="543" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">L'analyse comportementale</text><text x="1572" y="562.6" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">repère les anomalies ;</text><text x="1572" y="582.2" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">sanctions et suspension</text><text x="40" y="656" font-size="14" font-weight="800" fill="#0E7C7B" text-anchor="start">RÉSILIENCE — POURQUOI LE CHEMIN DE NIVEAU 0 FONCTIONNE QUAND D'AUTRES SERVICES SONT DÉGRADÉS</text><rect x="40" y="674" width="293.3333333333333" height="92" rx="14" ry="14" fill="#E7F5F3" stroke="#8CCFC7" stroke-width="1.5"/><g fill="none" stroke="#0E7C7B" stroke-width="1.71"><path d="M60.85,696.65 v-2.8499999999999996 a3.8,3.8 0 0 1 7.6,0 v2.8499999999999996"/></g><rect x="58" y="696.65" width="13.299999999999999" height="9.5" rx="1.9" fill="#0E7C7B"/><text x="84" y="706" font-size="15" font-weight="800" fill="#0B3B4A" text-anchor="start" data-maxw="237.33333333333331">Déploiement isolé</text><text x="58" y="740" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="263.3333333333333">cloisonné, capacité réservée</text><rect x="349.3333333333333" y="674" width="293.3333333333333" height="92" rx="14" ry="14" fill="#E7F5F3" stroke="#8CCFC7" stroke-width="1.5"/><g fill="none" stroke="#0E7C7B" stroke-width="1.71"><path d="M370.18333333333334,696.65 v-2.8499999999999996 a3.8,3.8 0 0 1 7.6,0 v2.8499999999999996"/></g><rect x="367.3333333333333" y="696.65" width="13.299999999999999" height="9.5" rx="1.9" fill="#0E7C7B"/><text x="393.3333333333333" y="706" font-size="15" font-weight="800" fill="#0B3B4A" text-anchor="start" data-maxw="237.33333333333331">Synthèse pré-calculée</text><text x="367.3333333333333" y="740" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="263.3333333333333">projection, sans jointure</text><rect x="658.6666666666666" y="674" width="293.3333333333333" height="92" rx="14" ry="14" fill="#E7F5F3" stroke="#8CCFC7" stroke-width="1.5"/><g fill="none" stroke="#0E7C7B" stroke-width="1.71"><path d="M679.5166666666667,696.65 v-2.8499999999999996 a3.8,3.8 0 0 1 7.6,0 v2.8499999999999996"/></g><rect x="676.6666666666666" y="696.65" width="13.299999999999999" height="9.5" rx="1.9" fill="#0E7C7B"/><text x="702.6666666666666" y="706" font-size="15" font-weight="800" fill="#0B3B4A" text-anchor="start" data-maxw="237.33333333333331">Répliques multi-AZ</text><text x="676.6666666666666" y="740" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="263.3333333333333">+ région de secours active</text><rect x="968" y="674" width="293.3333333333333" height="92" rx="14" ry="14" fill="#E7F5F3" stroke="#8CCFC7" stroke-width="1.5"/><g fill="none" stroke="#0E7C7B" stroke-width="1.71"><path d="M988.85,696.65 v-2.8499999999999996 a3.8,3.8 0 0 1 7.6,0 v2.8499999999999996"/></g><rect x="986" y="696.65" width="13.299999999999999" height="9.5" rx="1.9" fill="#0E7C7B"/><text x="1012" y="706" font-size="15" font-weight="800" fill="#0B3B4A" text-anchor="start" data-maxw="237.33333333333331">Jetons validés en local</text><text x="986" y="740" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="263.3333333333333">clés de l'IdP en cache</text><rect x="1277.3333333333333" y="674" width="293.3333333333333" height="92" rx="14" ry="14" fill="#E7F5F3" stroke="#8CCFC7" stroke-width="1.5"/><g fill="none" stroke="#0E7C7B" stroke-width="1.71"><path d="M1298.1833333333332,696.65 v-2.8499999999999996 a3.8,3.8 0 0 1 7.6,0 v2.8499999999999996"/></g><rect x="1295.3333333333333" y="696.65" width="13.299999999999999" height="9.5" rx="1.9" fill="#0E7C7B"/><text x="1321.3333333333333" y="706" font-size="15" font-weight="800" fill="#0B3B4A" text-anchor="start" data-maxw="237.33333333333331">Décisions locales</text><text x="1295.3333333333333" y="740" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="263.3333333333333">sidecar OPA, paquets en cache</text><rect x="1586.6666666666665" y="674" width="293.3333333333333" height="92" rx="14" ry="14" fill="#E7F5F3" stroke="#8CCFC7" stroke-width="1.5"/><g fill="none" stroke="#0E7C7B" stroke-width="1.71"><path d="M1607.5166666666664,696.65 v-2.8499999999999996 a3.8,3.8 0 0 1 7.6,0 v2.8499999999999996"/></g><rect x="1604.6666666666665" y="696.65" width="13.299999999999999" height="9.5" rx="1.9" fill="#0E7C7B"/><text x="1630.6666666666665" y="706" font-size="15" font-weight="800" fill="#0B3B4A" text-anchor="start" data-maxw="237.33333333333331">Audit via l'outbox</text><text x="1604.6666666666665" y="740" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="263.3333333333333">sans dépendre de la chaîne d'audit</text><rect x="40" y="796" width="1840" height="70" rx="14" ry="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/><text x="64" y="826" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Qui peut briser la glace ?</text><text x="64" y="850" font-size="14" font-weight="400" fill="#475569" text-anchor="start" data-maxw="1790">Praticiens vérifiés titulaires du droit acces_urgence (médecine d'urgence, gardes, SAMU), accordé par le responsable médical de MedX et revu chaque trimestre. Les patients peuvent s'y opposer lorsque la loi le permet.</text>
</svg>
