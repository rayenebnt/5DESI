<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" role="img" aria-label="MedX — Emergency Access (Break-Glass)">
  <title>MedX — Emergency Access (Break-Glass)</title>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E7C7B"/>
    </marker>
    
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B4FA6"/>
    </marker>
    
    <marker id="arr-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E4572E"/>
    </marker>
    
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D48A1A"/>
    </marker>
    
    <marker id="arr-sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F7FB8"/>
    </marker>
    
    <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    
    <marker id="arr-petrol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B3B4A"/>
    </marker>
    
    <marker id="arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="900" fill="#FFFFFF"/>
  <text x="40" y="54" font-size="30" font-weight="800" fill="#0F172A" text-anchor="start">Emergency Access (Break-Glass)</text><text x="40" y="84" font-size="16" font-weight="400" fill="#475569" text-anchor="start">High-priority requirement H3 · immediate access to critical data for authorized professionals, with full accountability afterwards</text><rect x="40" y="124" width="328" height="232" rx="16" ry="16" fill="#FFFFFF" stroke="#8CCFC7" stroke-width="1.6" filter="url(#shadow)"/><circle cx="74" cy="160" r="18" fill="#0E7C7B"/><text x="74" y="166.5" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="102" y="167" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" data-maxw="254">Identify the patient</text><text x="62" y="208" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Exact-match search only:</text><text x="62" y="227.88" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">INS / MedX ID, or name +</text><text x="62" y="247.76" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">birth date + sex</text><text x="62" y="267.64" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Minimal demographics to</text><text x="62" y="287.52" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">confirm identity</text><text x="62" y="307.4" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">No browsing, no wildcards</text><path d="M374,240 L412,240" fill="none" stroke="#0E7C7B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-teal)"/><rect x="418" y="124" width="328" height="232" rx="16" ry="16" fill="#FFFFFF" stroke="#8CCFC7" stroke-width="1.6" filter="url(#shadow)"/><circle cx="452" cy="160" r="18" fill="#0E7C7B"/><text x="452" y="166.5" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="480" y="167" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" data-maxw="254">Declare emergency</text><text x="440" y="208" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Reason code (unconscious,</text><text x="440" y="227.88" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">life-threatening, unable</text><text x="440" y="247.76" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">to consent…)</text><text x="440" y="267.64" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Free-text justification</text><text x="440" y="287.52" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Accountability statement</text><text x="440" y="307.4" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">“I will be audited”</text><path d="M752,240 L790,240" fill="none" stroke="#0E7C7B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-teal)"/><rect x="796" y="124" width="328" height="232" rx="16" ry="16" fill="#FFFFFF" stroke="#8CCFC7" stroke-width="1.6" filter="url(#shadow)"/><circle cx="830" cy="160" r="18" fill="#0E7C7B"/><text x="830" y="166.5" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="858" y="167" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" data-maxw="254">Step-up MFA</text><text x="818" y="208" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Passkey or smart card</text><text x="818" y="227.88" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">(e-CPS) in the last 15 min</text><text x="818" y="247.76" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Policy engine checks the</text><text x="818" y="267.64" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">emergency_access</text><text x="818" y="287.52" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">entitlement and the</text><text x="818" y="307.4" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">patient's opt-out</text><path d="M1130,240 L1168,240" fill="none" stroke="#0E7C7B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-teal)"/><rect x="1174" y="124" width="328" height="232" rx="16" ry="16" fill="#FFFFFF" stroke="#8CCFC7" stroke-width="1.6" filter="url(#shadow)"/><circle cx="1208" cy="160" r="18" fill="#0E7C7B"/><text x="1208" y="166.5" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="1236" y="167" font-size="18" font-weight="800" fill="#0F172A" text-anchor="start" data-maxw="254">Time-boxed grant</text><text x="1196" y="208" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">4 hours · read-only</text><text x="1196" y="227.88" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">This patient only</text><text x="1196" y="247.76" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Grant + audit event</text><text x="1196" y="267.64" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">written in the same</text><text x="1196" y="287.52" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">transaction</text><text x="1196" y="307.4" font-size="14" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="288">Renewable with a new reason</text><path d="M1508,240 L1546,240" fill="none" stroke="#0E7C7B" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr-teal)"/><rect x="1552" y="124" width="328" height="232" rx="16" ry="16" fill="#FDEDE8" stroke="#E4572E" stroke-width="2.2" filter="url(#shadow)"/><circle cx="1586" cy="160" r="18" fill="#E4572E"/><text x="1586" y="166.5" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="1614" y="167" font-size="18" font-weight="800" fill="#8C2A10" text-anchor="start" data-maxw="254">Summary in &lt; 1 s</text><text x="1574" y="208" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">International Patient</text><text x="1574" y="227.88" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">Summary: allergies, active</text><text x="1574" y="247.76" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">problems, medications,</text><text x="1574" y="267.64" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">blood group, implants,</text><text x="1574" y="287.52" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">advance directives, contacts</text><text x="1574" y="307.4" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">Full record: same grant</text><rect x="40" y="376" width="1840" height="44" rx="22" ry="22" fill="#0B3B4A" stroke="#0B3B4A" stroke-width="1"/><text x="960" y="404" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Clinician: ≈ 30 seconds from search to data (human steps)   ·   System: p95 &lt; 300 ms per API call   ·   Availability 99.99 %</text><text x="40" y="464" font-size="14" font-weight="800" fill="#E4572E" text-anchor="start">GUARDRAILS — ACCOUNTABILITY AFTER THE FACT (access is never blocked, always answered for)</text><rect x="40" y="482" width="328" height="128" rx="14" ry="14" fill="#FDEDE8" stroke="#F4B6A3" stroke-width="1.5"/><text x="60" y="514" font-size="16.5" font-weight="800" fill="#8C2A10" text-anchor="start" data-maxw="288">Immutable audit</text><text x="60" y="543" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">AuditEvent, purpose =</text><text x="60" y="562.6" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">emergency treatment,</text><text x="60" y="582.2" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">kept in the WORM trail</text><rect x="418" y="482" width="328" height="128" rx="14" ry="14" fill="#FDEDE8" stroke="#F4B6A3" stroke-width="1.5"/><text x="438" y="514" font-size="16.5" font-weight="800" fill="#8C2A10" text-anchor="start" data-maxw="288">Real-time alert</text><text x="438" y="543" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">Privacy office alerted</text><text x="438" y="562.6" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">through the SIEM the</text><text x="438" y="582.2" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">moment access starts</text><rect x="796" y="482" width="328" height="128" rx="14" ry="14" fill="#FDEDE8" stroke="#F4B6A3" stroke-width="1.5"/><text x="816" y="514" font-size="16.5" font-weight="800" fill="#8C2A10" text-anchor="start" data-maxw="288">Patient informed</text><text x="816" y="543" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">In-app + e-mail notice</text><text x="816" y="562.6" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">within 24 h: who, when,</text><text x="816" y="582.2" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">what was viewed</text><rect x="1174" y="482" width="328" height="128" rx="14" ry="14" fill="#FDEDE8" stroke="#F4B6A3" stroke-width="1.5"/><text x="1194" y="514" font-size="16.5" font-weight="800" fill="#8C2A10" text-anchor="start" data-maxw="288">Mandatory review</text><text x="1194" y="543" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">Privacy officer + medical</text><text x="1194" y="562.6" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">lead review every case</text><text x="1194" y="582.2" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">within 72 h</text><rect x="1552" y="482" width="328" height="128" rx="14" ry="14" fill="#FDEDE8" stroke="#F4B6A3" stroke-width="1.5"/><text x="1572" y="514" font-size="16.5" font-weight="800" fill="#8C2A10" text-anchor="start" data-maxw="288">Misuse detection</text><text x="1572" y="543" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">Behaviour analytics flag</text><text x="1572" y="562.6" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">outliers; sanctions and</text><text x="1572" y="582.2" font-size="14" font-weight="400" fill="#6B2A18" text-anchor="start" data-maxw="288">account suspension</text><text x="40" y="656" font-size="14" font-weight="800" fill="#0E7C7B" text-anchor="start">RESILIENCE — WHY THE TIER-0 PATH KEEPS WORKING WHEN OTHER SERVICES ARE DEGRADED</text><rect x="40" y="674" width="293.3333333333333" height="92" rx="14" ry="14" fill="#E7F5F3" stroke="#8CCFC7" stroke-width="1.5"/><g fill="none" stroke="#0E7C7B" stroke-width="1.71"><path d="M60.85,696.65 v-2.8499999999999996 a3.8,3.8 0 0 1 7.6,0 v2.8499999999999996"/></g><rect x="58" y="696.65" width="13.299999999999999" height="9.5" rx="1.9" fill="#0E7C7B"/><text x="84" y="706" font-size="15" font-weight="800" fill="#0B3B4A" text-anchor="start" data-maxw="237.33333333333331">Isolated deployment</text><text x="58" y="740" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="263.3333333333333">bulkhead with reserved capacity</text><rect x="349.3333333333333" y="674" width="293.3333333333333" height="92" rx="14" ry="14" fill="#E7F5F3" stroke="#8CCFC7" stroke-width="1.5"/><g fill="none" stroke="#0E7C7B" stroke-width="1.71"><path d="M370.18333333333334,696.65 v-2.8499999999999996 a3.8,3.8 0 0 1 7.6,0 v2.8499999999999996"/></g><rect x="367.3333333333333" y="696.65" width="13.299999999999999" height="9.5" rx="1.9" fill="#0E7C7B"/><text x="393.3333333333333" y="706" font-size="15" font-weight="800" fill="#0B3B4A" text-anchor="start" data-maxw="237.33333333333331">Pre-computed summary</text><text x="367.3333333333333" y="740" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="263.3333333333333">projection, no joins at read time</text><rect x="658.6666666666666" y="674" width="293.3333333333333" height="92" rx="14" ry="14" fill="#E7F5F3" stroke="#8CCFC7" stroke-width="1.5"/><g fill="none" stroke="#0E7C7B" stroke-width="1.71"><path d="M679.5166666666667,696.65 v-2.8499999999999996 a3.8,3.8 0 0 1 7.6,0 v2.8499999999999996"/></g><rect x="676.6666666666666" y="696.65" width="13.299999999999999" height="9.5" rx="1.9" fill="#0E7C7B"/><text x="702.6666666666666" y="706" font-size="15" font-weight="800" fill="#0B3B4A" text-anchor="start" data-maxw="237.33333333333331">Multi-AZ replicas</text><text x="676.6666666666666" y="740" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="263.3333333333333">+ DR region serving reads (active)</text><rect x="968" y="674" width="293.3333333333333" height="92" rx="14" ry="14" fill="#E7F5F3" stroke="#8CCFC7" stroke-width="1.5"/><g fill="none" stroke="#0E7C7B" stroke-width="1.71"><path d="M988.85,696.65 v-2.8499999999999996 a3.8,3.8 0 0 1 7.6,0 v2.8499999999999996"/></g><rect x="986" y="696.65" width="13.299999999999999" height="9.5" rx="1.9" fill="#0E7C7B"/><text x="1012" y="706" font-size="15" font-weight="800" fill="#0B3B4A" text-anchor="start" data-maxw="237.33333333333331">Local token validation</text><text x="986" y="740" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="263.3333333333333">cached IdP signing keys</text><rect x="1277.3333333333333" y="674" width="293.3333333333333" height="92" rx="14" ry="14" fill="#E7F5F3" stroke="#8CCFC7" stroke-width="1.5"/><g fill="none" stroke="#0E7C7B" stroke-width="1.71"><path d="M1298.1833333333332,696.65 v-2.8499999999999996 a3.8,3.8 0 0 1 7.6,0 v2.8499999999999996"/></g><rect x="1295.3333333333333" y="696.65" width="13.299999999999999" height="9.5" rx="1.9" fill="#0E7C7B"/><text x="1321.3333333333333" y="706" font-size="15" font-weight="800" fill="#0B3B4A" text-anchor="start" data-maxw="237.33333333333331">Local policy decisions</text><text x="1295.3333333333333" y="740" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="263.3333333333333">OPA sidecar, cached bundles</text><rect x="1586.6666666666665" y="674" width="293.3333333333333" height="92" rx="14" ry="14" fill="#E7F5F3" stroke="#8CCFC7" stroke-width="1.5"/><g fill="none" stroke="#0E7C7B" stroke-width="1.71"><path d="M1607.5166666666664,696.65 v-2.8499999999999996 a3.8,3.8 0 0 1 7.6,0 v2.8499999999999996"/></g><rect x="1604.6666666666665" y="696.65" width="13.299999999999999" height="9.5" rx="1.9" fill="#0E7C7B"/><text x="1630.6666666666665" y="706" font-size="15" font-weight="800" fill="#0B3B4A" text-anchor="start" data-maxw="237.33333333333331">Audit via outbox</text><text x="1604.6666666666665" y="740" font-size="13" font-weight="400" fill="#1E293B" text-anchor="start" data-maxw="263.3333333333333">no dependency on the audit pipeline</text><rect x="40" y="796" width="1840" height="70" rx="14" ry="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/><text x="64" y="826" font-size="15" font-weight="800" fill="#0F172A" text-anchor="start">Who can break the glass?</text><text x="64" y="850" font-size="14" font-weight="400" fill="#475569" text-anchor="start" data-maxw="1790">Verified practitioners holding the emergency_access entitlement (emergency medicine, on-call, EMS), granted by the MedX medical lead and reviewed quarterly. Patients may opt out where the law allows it.</text>
</svg>
